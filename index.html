<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- CONFIGURAÇÕES BÁSICAS -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>🚬 Cigarros Loja</title>
    
    <!-- CARREGA CSS EXTERNO -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- CONTAINER PRINCIPAL -->
    <div class="container">
        
        <!-- HEADER COM LOGO E TÍTULO -->
        <div class="header">
            <img src="image-loja.jpeg" alt="Logo Loja" class="logo">
            <div>
                <h1> Distribuidora & Tabacaria</h1>
                
            </div>
        </div>
        
        <!-- FORMULÁRIO DE VENDAS -->
        <div class="form-section">
            <!-- CAMPOS DE ENTRADA -->
            <div class="form-row">
               <input id="marca" list="listaMarcas" placeholder="Digite a marca" oninput="preencherPreco()">

<datalist id="listaMarcas">
    <option value="Carlton Red"> 
    <option value="Carlton Blue">  
    <option value="Double Refresh">  
    <option value="Mix Refresh">  
    <option value="Ice Refresh">  
    <option value="Evoque Essence"> 
    <option value="Free Red"> 
    <option value="Free Blue">  
    <option value="Full Red"> 
    <option value="Lucky Strike Ori. Red"> 
    <option value="Double Ice"> 
    <option value="Lucky Strike Ori. Blue"> 
    <option value="R.A Patterson Red">  
    <option value="R.A Patterson Blue"> 
    <option value="Fresh Mint X"> 
    <option value="Fresh Wild">  
    <option value="Fresh Ice">
    <option value="Rothmans Ori. Blue"> 
    <option value="Rothmans Ori. Red"> 
    <option value="Rothmans Ori. Silver"> 
    <option value="Rothmans Internacional">  
    <option value="Rothmans Global Blue">  
    <option value="Rothmans Global Red"> 
    <option value="Kent Blue">  
    <option value="Kent Red"> 
    <option value="Kent Silver">  
    <option value="Harmony">  
    <option value="Marlboro Red">  
    <option value="Marlboro Gold"> 
    <option value="Marlboro vista">  
    <option value="Marlboro Gold selection"> 
    <option value="Marlboro Blue selection">  
    <option value="Marlboro red selection">
    <option value="Marlboro Ice">  
    <option value="Marlboro Double Mix">  
    <option value="Marlboro Double Fusion">
    <option value="Camel Filters">  
    <option value="Camel Blue">  
    <option value="Camel Double Mint & Purple"> 
    <option value="Black Kretek Menthol"> 
    <option value="Gudang"> 
    <option value="Winston Blue">  
    <option value="Winston Red"> 
    <option value="Winston Silver"> 
    <option value="Winston P. Mint">  
    <option value="Winston Classic"> 
</datalist>
                
                <input id="qtdpedidos" placeholder="Qtd Pedidos" type="number" min="1" value="1">
                <input id="comprador" placeholder="COMPRADOR">
                <input id="preco" placeholder="R$" type="number" step="0.01">
            </div>
            
            <!-- BOTÕES DE AÇÃO -->
            <div class="form-row">
                <button onclick="addCarga()">➕ ADICIONAR VENDA</button>
                <button onclick="clearForm()" class="btn-danger">✏️ LIMPAR FORMULÁRIO</button>
                <button onclick="limparTodos()" class="btn-danger reset-btn">🗑️ LIMPAR TODAS VENDAS</button>
                <button onclick="exportData()">💾 EXTRATO DO DIA</button>
            </div>
        </div>
        
        
            <!-- TABELA VENDAS -->
            <table>
                <thead>
                    <tr>
                        <th>Marca</th>
                        <th>Qtd</th>
                        <th>Comprador</th>
                        <th>Total R$</th>
                        <th>Açôes</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <!-- VENDAS AQUI -->
                </tbody>
            </table>

            <!-- TABELA E ESTATÍSTICAS -->
        <div class="table-section">
            <!-- CARDS RESUMO -->
            <div class="stats">
                <div class="stat">
                    <div id="totalP">0</div>
                    Total Vendas
                </div>
                <div class="stat">
                    <div id="totalV">R$0</div>
                    Total Vendido
                </div>
            </div>
        </div>
    </div>


    <div class="finalizados-box">
    <h3>Vendas Finalizadas</h3>

    <div class="botoes-finalizadas">
        <button onclick="exportFinalizadas()">📄 EXTRATO FINALIZADAS</button>
        <button onclick="limparFinalizadas()" class="btn-danger">🧹 LIMPAR FINALIZADAS</button>
    </div>

    <div id="vendasFinalizadas">
        Nenhuma venda finalizada ainda.
    </div>
</div>




    
    <!-- CARREGA JAVASCRIPT -->
    <script src="script.js"></script>
</body>
</html>
